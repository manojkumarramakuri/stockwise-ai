name: StockWise AI checks

on:
  push:
    branches: [main, stockwise-market-data-integration]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all application Python files
        run: python -m compileall -q app.py pages market_data
      - name: Validate requirements file
        run: python -c "from pathlib import Path; p=Path('requirements.txt'); assert p.exists() and p.read_text().strip(); print('requirements.txt present')"
